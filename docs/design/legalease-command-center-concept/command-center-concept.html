<!DOCTYPE html>
<html lang="en">
<head>

<title>LegalEase Command Center — Solo Operator Concept</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--canvas);font-family:Inter,"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

.icon.sm{width:15px;height:15px}.icon.lg{width:22px;height:22px}.icon.xl{width:28px;height:28px}
.app{width:1600px;height:1000px;display:grid;grid-template-columns:248px 1fr;background:var(--canvas)}

.nav-item.active .icon{color:#ff6a3c}.nav-item.active .nav-count{background:rgba(255,59,0,.18);color:#ff8a65}
.sidebar-spacer{flex:1}

.assistant-card .top{display:flex;align-items:center;gap:10px}.assistant-orb{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff6a3d,#ff3b00);display:grid;place-items:center;box-shadow:0 8px 18px rgba(255,59,0,.22)}
.assistant-card strong{font-size:13px}.assistant-card p{font-size:11px;color:#9aa6b7;margin:8px 0 10px}.assistant-card button{height:32px;width:100%;border:0;border-radius:9px;background:#fff;color:var(--navy);font-size:11px;font-weight:700}
.sidebar-bottom{display:flex;align-items:center;gap:10px;padding:8px 8px 0;position:relative;z-index:1}.sidebar-bottom .avatar{width:34px;height:34px;border-radius:50%;background:#263550;display:grid;place-items:center;font-weight:700;font-size:12px;border:1px solid rgba(255,255,255,.09)}.sidebar-bottom .who{min-width:0}.sidebar-bottom strong{font-size:12px;display:block}.sidebar-bottom span{font-size:10px;color:#8190a5}.sidebar-bottom .icon{margin-left:auto;color:#76849a}

.topbar-left{display:flex;align-items:center;gap:10px;min-width:240px}.topbar-left .crumb{font-size:12px;color:var(--muted)}.topbar-left .slash{color:#c4c9d0}.topbar-left strong{font-size:13px}
.topbar-search{margin-left:auto;width:360px;height:40px;border:1px solid var(--border-2);border-radius:11px;background:#f8f9fb;display:flex;align-items:center;gap:10px;padding:0 12px;color:#7a8493}.topbar-search span{font-size:12px}.kbd{margin-left:auto;border:1px solid #d8dde4;background:#fff;border-radius:6px;padding:2px 7px;color:#8a94a3;font-size:10px;box-shadow:0 1px 1px rgba(16,24,40,.03)}

.main{overflow:hidden;padding:30px 34px 34px;background:radial-gradient(circle at 80% 0%,rgba(255,255,255,.9),transparent 28%),var(--canvas);position:relative}
.page{height:100%;display:none}.page.active{display:block}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.page-head h1{font-size:28px;line-height:1.12;margin:0;letter-spacing:-.7px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.page-head-actions{display:flex;align-items:center;gap:10px}
.eyebrow{color:var(--orange);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.date-chip{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:8px 11px;border-radius:10px;background:#fff;border:1px solid var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.card-flat{background:var(--card);border:1px solid var(--border);border-radius:14px}.card-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid #edf0f3}.card-head h2,.card-head h3{margin:0;font-size:14px;letter-spacing:-.15px}.card-head .sub{font-size:11px;color:var(--muted)}
.section-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:#475467;text-transform:uppercase;letter-spacing:.08em}.section-label .count{font-size:10px;padding:2px 7px;border-radius:9px;background:#eef1f5;color:#697586;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}.pill.orange{background:var(--orange-soft);color:var(--orange-dark)}.pill.green{background:var(--green-soft);color:var(--green)}.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.red{background:var(--red-soft);color:var(--red)}.pill.purple{background:var(--purple-soft);color:var(--purple)}.pill.gray{background:#f0f2f5;color:#5e6978}.pill.navy{background:#e9edf4;color:#24334d}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.status-line{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.status-line .healthy{color:var(--green)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#eef1f6;color:#344054;flex:0 0 auto}.avatar.orange{background:#fff0eb;color:#c43208}.avatar.blue{background:#eef4ff;color:#175cd3}.avatar.purple{background:#f4f0ff;color:#6941c6}.avatar.green{background:#e8f7f3;color:#117a65}.avatar.navy{background:#e9edf4;color:#24334d}
.divider{height:1px;background:var(--border);margin:16px 0}
.muted{color:var(--muted)}.small{font-size:11px}.tiny{font-size:10px}.strong{font-weight:700}.nowrap{white-space:nowrap}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Today */
.today-layout{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(330px,.78fr);gap:18px;height:calc(100% - 92px)}
.today-main,.today-side{min-height:0;display:flex;flex-direction:column;gap:16px}

.now-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.now-top .rank{display:flex;align-items:center;gap:9px;color:var(--orange);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.now-top .rank-icon{width:28px;height:28px;border-radius:9px;background:var(--orange-soft);display:grid;place-items:center}.now-top .due{display:flex;align-items:center;gap:6px;color:var(--red);font-size:11px;font-weight:700}

.next-card{flex:1;min-height:0;display:flex;flex-direction:column}.work-list{padding:4px 10px 8px;overflow:hidden}.work-row{min-height:61px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 8px;border-bottom:1px solid #eff1f4}.work-row:last-child{border-bottom:0}.work-index{width:28px;height:28px;border-radius:9px;background:#f2f4f7;display:grid;place-items:center;color:#667085;font-size:11px;font-weight:800}.work-row .title{font-size:12px;font-weight:700;letter-spacing:-.05px}.work-row .meta{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--muted);font-size:10px}.work-row .right{text-align:right}.work-row .right strong{display:block;font-size:10px}.work-row .right span{font-size:9px;color:var(--muted)}
.side-stack{padding:8px 14px 12px}.comm-row,.meeting-row,.attention-row{display:flex;gap:10px;padding:10px 3px;border-bottom:1px solid #eff1f4}.comm-row:last-child,.meeting-row:last-child,.attention-row:last-child{border-bottom:0}.comm-copy{min-width:0;flex:1}.comm-copy strong{font-size:11px;display:flex;align-items:center;gap:6px}.comm-copy p{margin:3px 0 0;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comm-time{font-size:9px;color:var(--muted);white-space:nowrap}.unread-dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}

.attention-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--red-soft);color:var(--red)}.attention-row.warn .attention-icon{background:var(--amber-soft);color:var(--amber)}.attention-row .comm-copy strong{font-size:11px}.attention-row .action-link{font-size:10px;color:var(--orange);font-weight:700;margin-top:4px}

/* Tables */
.segmented{display:flex;align-items:center;gap:4px;background:#eceff3;border-radius:10px;padding:4px;width:max-content}.segment{height:32px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:#667085;font-weight:700;font-size:11px}.segment.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.08)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:9px}.filter-btn{height:36px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:0 11px;display:flex;align-items:center;gap:7px;color:#475467;font-size:11px;font-weight:700}.filter-btn .badge{background:#eef1f5;border-radius:9px;padding:1px 6px;font-size:9px}.mini-search{height:36px;width:230px;border:1px solid var(--border);border-radius:9px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;color:#98a2b3;font-size:11px}
.data-card{height:calc(100% - 138px);overflow:hidden}.table{width:100%;border-collapse:collapse}.table th{text-align:left;height:40px;padding:0 14px;background:#f9fafb;color:#7a8493;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border)}.table td{height:64px;padding:0 14px;border-bottom:1px solid #edf0f3;vertical-align:middle;font-size:11px}.table tr:last-child td{border-bottom:0}.name-cell{display:flex;align-items:center;gap:10px;min-width:190px}.name-cell strong{display:block;font-size:11px}.name-cell span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.roles{display:flex;gap:4px;flex-wrap:wrap}.stage{display:flex;align-items:center;gap:7px;font-weight:700;color:#344054}.stage-dot{width:8px;height:8px;border-radius:50%;background:#9aa4b3}.stage-dot.orange{background:var(--orange)}.stage-dot.green{background:var(--green)}.stage-dot.blue{background:var(--blue)}.stage-dot.purple{background:var(--purple)}
.strength{display:flex;align-items:center;gap:7px}.strength-bars{display:flex;gap:2px}.strength-bars i{width:3px;height:11px;border-radius:2px;background:#e4e7ec}.strength-bars i.on{background:var(--orange)}.priority{display:flex;align-items:center;gap:6px}.priority i{width:7px;height:7px;border-radius:50%;background:#d0d5dd}.priority.high i{background:var(--red)}.priority.medium i{background:var(--amber)}.priority.critical i{background:#7f1d1d}
/* Relationship detail */
.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin-bottom:14px}.relationship-head{display:flex;align-items:center;gap:15px;margin-bottom:20px}.relationship-head .avatar{width:52px;height:52px;font-size:14px}.relationship-title{min-width:0}.relationship-title h1{font-size:24px;margin:0;letter-spacing:-.5px}.relationship-title .subline{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:11px}.relationship-actions{margin-left:auto;display:flex;gap:8px}.relationship-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,.76fr);gap:18px;height:calc(100% - 111px)}

10px}.toggle-row span{font-size:8px;color:var(--muted);display:block;margin-top:2px}.toggle{margin-left:auto;width:36px;height:20px;border-radius:12px;background:#d8dde4;padding:2px;display:flex;justify-content:flex-start}.toggle i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.18)}.toggle.on{background:var(--green);justify-content:flex-end}.danger-note{display:flex;align-items:center;gap:8px;color:var(--red);font-size:8px;font-weight:700;margin-top:8px}

<script>
const I=(name,cls='')=>`<svg class="icon ${cls}"><use href="#i-${name}"></use></svg>`;
const avatar=(text,cls='')=>`<div class="avatar ${cls}">${text}</div>`;
const pill=(text,cls='gray')=>`<span class="pill ${cls}">${text}</span>`;

function sidebar(active='today'){
  const nav=[['today','home','Today','7'],['relationships','users','Relationships','12'],['campaigns','megaphone','Campaigns','3'],['scoreboard','chart','Scoreboard','']];
  return `<aside class="sidebar">

    <nav class="nav">${nav.map(([id,icon,label,count])=>`<a class="nav-item ${active===id?'active':''}">${I(icon)}<span>${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</a>`).join('')}</nav>

}

  return `<header class="topbar"><div class="topbar-left"><span class="crumb">Command Center</span><span class="slash">/</span><strong>${workspace}</strong></div>

}
function shell(active,workspace,content){return `<div class="app">${sidebar(active)}<section class="shell">${topbar(workspace)}<main class="main">${content}</main></section></div>`}

 ['JE','Jordan Example','Sample Partner Organization',['Partner','Media'],'Conversation','Roger','Today · Send intro','Warm','High','orange'],
