# ---------------------------------------------------------------------------------------------
# READ THIS BEFORE TRUSTING OR RE-APPLYING THIS FILE.
#
# THIS BLUEPRINT DOES NOT DESCRIBE THE PRODUCTION SERVICE.
#
# Production is the Render service `legalease-command-center-prod`. It is NOT named anywhere in
# this file — the web service declared below is `legalease-command-center`, a separate and stale
# service. Editing values here does not change production, and a diff that appears to correct
# production's configuration does not.
#
# Production's deploy configuration lives in the RENDER DASHBOARD, as After-CI auto-deploy:
# Render deploys production only once CI passes on main. There is NO render.yaml equivalent for
# that setting — `autoDeploy` is a boolean, so no value in this file can express it. Writing
# `autoDeploy: true` would assert "deploy on every push", which is strictly LESS safe than what
# is configured, and would remove the CI gate if it were ever synced.
#
# THIS FILE HAS DRIFTED FROM LIVE VALUES. Verified read-only against the Render API on
# 2026-07-26:
#
#   legalease-command-center-prod   web    autoDeploy = yes   (production; absent from this file)
#   legalease-command-center        web    autoDeploy = no    (declared below as false — matches)
#   legalease-heartbeat             cron   autoDeploy = yes   (declared below as false — DRIFTED)
#
# Treat this file as a HISTORICAL DEFINITION, not a source of truth. **Re-applying this blueprint
# could push stale values onto live services**, including setting the heartbeat cron's auto-deploy
# back to false.
#
# The deploy protections genuinely in force are recorded in
# `docs/founder-os/06_SAFETY_AND_AUTOMATION_CONTRACT.md` — see the amendment dated 2026-07-26,
# "manual production deployment is retired, not violated": branch protection requiring seven
# green checks, CI-gated deploy, post-deploy verification against live production, automatic
# revert on verification failure, and the release gate.
#
# No autoDeploy value in this file has been changed. Whether to drop production from blueprint
# management, or retire the stale service entirely, is Roger's decision.
# ---------------------------------------------------------------------------------------------

services:
  - type: web
    name: legalease-command-center
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24.x"
      - key: NODE_ENV
        value: production
      - key: LOCAL_DEMO_MODE
        value: "false"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: social-assets
      - key: SOCIAL_DRAFT_ASSETS_BUCKET
        value: social-draft-assets-private
      - key: APP_BASE_URL
        value: https://legalease-command-center-prod.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COMMAND_CENTER_OWNER_TOKEN
        sync: false
      - key: COMMAND_CENTER_SESSION_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: COMMAND_CENTER_CRON_TOKEN
        sync: false
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: ASSET_SIGNING_SECRET
        sync: false
      - key: SENDGRID_WEBHOOK_ENABLED
        value: "true"
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: PRODUCT_EVENT_WEBHOOK_ENABLED
        value: "true"
      - key: PRODUCT_EVENT_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_LIVE_LINKEDIN_POSTING
        value: "false"
      - key: ENABLE_LIVE_FACEBOOK_POSTING
        value: "false"
      - key: ENABLE_LIVE_INSTAGRAM_POSTING
        value: "false"
      - key: ENABLE_LIVE_X_POSTING
        value: "false"
      - key: ENABLE_LIVE_TIKTOK_POSTING
        value: "false"
      - key: ENABLE_LIVE_THREADS_POSTING
        value: "false"
      - key: REACTIVATION_LIVE_SEND
        value: "false"
      - key: OUTREACH_LIVE_SEND
        value: "false"
      - key: ALERT_EMAIL_LIVE_SEND
        value: "false"
      - key: PROSPECT_LIVE_DISCOVERY
        value: "false"
      - key: ALLOW_LOCAL_IMAGE_FALLBACK
        value: "false"

  # B1 heartbeat: a single hourly cron POSTs the protected tick endpoint. ET-aware due
  # logic in the app decides what runs (hourly engines every tick; daily engines at 6am
  # ET, DST-correct). Authenticated with a dedicated, independently-revocable cron token.
  - type: cron
    name: legalease-heartbeat
    env: node
    schedule: "0 * * * *"
    buildCommand: echo "no build needed for the heartbeat cron"
    startCommand: 'curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $COMMAND_CENTER_CRON_TOKEN" "$HEARTBEAT_TICK_URL"'
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24.x"
      - key: HEARTBEAT_TICK_URL
        value: https://legalease-command-center-prod.onrender.com/api/heartbeat/tick
      - key: COMMAND_CENTER_CRON_TOKEN
        sync: false
